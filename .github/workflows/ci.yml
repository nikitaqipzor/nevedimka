name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nevidimka

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Reject tracked TypeScript build metadata
        run: |
          tracked_build_info="$(git ls-files '*.tsbuildinfo')"
          if [ -n "$tracked_build_info" ]; then
            echo "Tracked tsbuildinfo files must be removed:"
            printf '%s\n' "$tracked_build_info"
            exit 1
          fi

      - name: Validate deployment configuration
        run: |
          bash -n docker/postgres-init-app-role.sh
          POSTGRES_PASSWORD=ci_system_password APP_DB_PASSWORD=ci_app_password ENV_FILE=.env.example docker compose config --quiet

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nevidimka/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit all locked dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: typecheck-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nevidimka/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build all workspaces
        run: npm run build

      - name: Run tests
        run: npm test

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v5
      - name: Build production images and verify roles, volumes and deletion
        run: bash scripts/smoke-compose.sh
