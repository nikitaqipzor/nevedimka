name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces (in dependency order)
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A superuser connection to the service container — each test file
      # creates and drops its own throwaway database against this, and
      # packages/db's test additionally creates its own restricted,
      # non-superuser role to actually exercise RLS (see test/rls.test.ts).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Install ffmpeg (for packages/video's test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build all workspaces (in dependency order)
        run: npm run build

      - name: Run tests (db RLS attack test, video pipeline, bot full-flow, web e2e)
        run: npm test
